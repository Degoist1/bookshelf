<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookShelf - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">BookShelf</span>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card p-4">
          <h3 class="mb-3">Create an account</h3>

          <form id="regForm">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" id="name" class="form-control">
              <small class="text-danger" id="nameError"></small>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="text" id="email" class="form-control">
              <small class="text-danger" id="emailError"></small>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-control">
              <small class="text-danger" id="passwordError"></small>
            </div>

            <div class="mb-3">
              <label for="confirm" class="form-label">Confirm Password</label>
              <input type="password" id="confirm" class="form-control">
              <small class="text-danger" id="confirmError"></small>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>

          <p id="success" class="text-success mt-3"></p>
        </div>
      </div>
    </div>
  </div>
  <div class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card p-4">
          <h3 class="mb-3">My Books</h3>

          <div class="input-group mb-3">
            <input type="text" id="bookInput" class="form-control" placeholder="Enter book name">
            <button class="btn btn-success" id="addBtn">Add</button>
          </div>

          <ul class="list-group mb-3" id="bookList"></ul>

          <div class="d-flex justify-content-between align-items-center">
            <span id="bookCount"></span>
            <button class="btn btn-outline-danger btn-sm" id="clearBtn">Clear All</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
    <script src="script.js"></script>
  <script src="books.js"></script>
</body>
</html>
